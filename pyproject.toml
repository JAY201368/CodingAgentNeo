[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-neo"
version = "0.1.0"
description = "A small, inspectable coding-agent project scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "CodingAgentNeo contributors" },
]
dependencies = [
    "openai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
coding-agent-neo = "coding_agent_neo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = [".git", ".hg", ".svn", ".tox", ".venv", "venv", "dist", "build", "*.egg", "tests/fixtures"]
markers = [
    "acceptance: baseline AC-01 through AC-14 aggregate evidence",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
